<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="posterTitle posterDesc">
  <title id="posterTitle">MoniSwitch — every display, one switch</title>
  <desc id="posterDesc">A dark aurora poster for MoniSwitch, a macOS menu-bar display control centre, with a monitor, a brightness card and a layout card.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0B13"/>
      <stop offset="0.55" stop-color="#08080E"/>
      <stop offset="1" stop-color="#050509"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FD0FF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#4FD0FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#4FD0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9A5CFF" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#B84BE8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B84BE8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCoral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9866" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#FF47AB" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FF47AB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD0FF"/>
      <stop offset="0.26" stop-color="#5B70FF"/>
      <stop offset="0.54" stop-color="#A241FF"/>
      <stop offset="0.79" stop-color="#FF47AB"/>
      <stop offset="1" stop-color="#FF9866"/>
    </linearGradient>

    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9BE8FF"/>
      <stop offset="0.46" stop-color="#C7A4FF"/>
      <stop offset="1" stop-color="#FFB08C"/>
    </linearGradient>

    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35353F"/>
      <stop offset="0.4" stop-color="#1A1A21"/>
      <stop offset="1" stop-color="#0D0D12"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF4EF"/>
    </linearGradient>

    <linearGradient id="screenGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fadeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="cardShadow" x="-30%" y="-40%" width="170%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>

    <filter id="monitorShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <clipPath id="screenClip">
      <rect x="994" y="186" width="446" height="276" rx="16"/>
    </clipPath>

    <clipPath id="iconClip">
      <rect x="110" y="76" width="46" height="46" rx="14"/>
    </clipPath>

    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <rect width="1600" height="640" fill="url(#dots)" opacity="0.5"/>
  <circle cx="260" cy="70" r="430" fill="url(#glowCyan)"/>
  <circle cx="1180" cy="290" r="500" fill="url(#glowPurple)"/>
  <circle cx="1490" cy="610" r="380" fill="url(#glowCoral)"/>

  <!-- top lockup -->
  <g>
    <rect x="110" y="76" width="46" height="46" rx="14" fill="#121219" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <g clip-path="url(#iconClip)">
      <rect x="110" y="76" width="46" height="46" fill="#101017"/>
      <rect x="117" y="87" width="32" height="21" rx="4" fill="url(#aurora)"/>
      <rect x="126" y="94" width="14" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.92"/>
      <circle cx="137" cy="97.5" r="2.6" fill="#FFFFFF"/>
      <rect x="131" y="110" width="4" height="4" fill="#2B2B34"/>
      <rect x="124" y="113" width="18" height="2" rx="1" fill="#2B2B34"/>
    </g>
    <text x="172" y="106" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#F7F7FC" letter-spacing="-0.4">MoniSwitch</text>
    <text x="173" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#8B8B9D" letter-spacing="2.6">DISPLAY CONTROL FOR macOS</text>
  </g>

  <!-- eyebrow -->
  <text x="110" y="196" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8E8EA2" letter-spacing="3.1">MENU-BAR NATIVE</text>

  <!-- headline -->
  <text x="106" y="284" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="700" fill="#FAFAFF" letter-spacing="-2.6">Every display.</text>
  <text x="106" y="366" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="700" fill="url(#headline)" letter-spacing="-2.6">One switch.</text>

  <!-- subline -->
  <text x="110" y="424" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20.5" fill="#B8B8C8" letter-spacing="0.1">Switch the main screen, arrange mirrors and dim every</text>
  <text x="110" y="454" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20.5" fill="#B8B8C8" letter-spacing="0.1">display — without leaving the menu bar.</text>

  <!-- feature chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#D9D9E4">
    <rect x="110" y="486" width="132" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="176" y="509" text-anchor="middle">Main display</text>
    <rect x="254" y="486" width="162" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="335" y="509" text-anchor="middle">Arrange &amp; mirror</text>
    <rect x="428" y="486" width="156" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="506" y="509" text-anchor="middle">DDC brightness</text>
    <rect x="596" y="486" width="112" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <text x="652" y="509" text-anchor="middle">7 themes</text>
  </g>

  <!-- footer -->
  <line x1="110" y1="566" x2="760" y2="566" stroke="url(#fadeLine)" stroke-width="1"/>
  <circle cx="115" cy="596" r="3.5" fill="#6E8A60"/>
  <text x="130" y="601" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#85859A" letter-spacing="0.2">macOS 14+ · Apple Silicon · Free &amp; open source</text>

  <!-- right-hand visual -->
  <g>
    <!-- ambient bloom behind monitor -->
    <ellipse cx="1215" cy="330" rx="320" ry="220" fill="#8B5CF6" fill-opacity="0.12" filter="url(#softGlow)"/>

    <!-- monitor -->
    <g filter="url(#monitorShadow)">
      <rect x="958" y="150" width="518" height="348" rx="28" fill="url(#bezel)" stroke="#FFFFFF" stroke-opacity="0.13"/>
      <rect x="978" y="170" width="478" height="308" rx="18" fill="#09090F"/>
      <g clip-path="url(#screenClip)">
        <rect x="994" y="186" width="446" height="276" fill="url(#aurora)"/>
        <rect x="994" y="186" width="446" height="276" fill="url(#screenGloss)"/>
        <circle cx="1090" cy="228" r="150" fill="#FFFFFF" fill-opacity="0.10" filter="url(#softGlow)"/>
        <circle cx="1380" cy="420" r="140" fill="#FF86C8" fill-opacity="0.18" filter="url(#softGlow)"/>
        <!-- glass toggle on the screen -->
        <rect x="1166" y="292" width="92" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.30" stroke="#FFFFFF" stroke-opacity="0.55"/>
        <circle cx="1236" cy="314" r="16" fill="#FFFFFF"/>
        <circle cx="1236" cy="314" r="16" fill="#FFFFFF" fill-opacity="0.35" filter="url(#softGlow)"/>
        <!-- screen bezel highlight -->
        <rect x="994" y="186" width="446" height="276" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
      </g>
      <!-- camera -->
      <circle cx="1217" cy="161" r="2.4" fill="#FFFFFF" fill-opacity="0.35"/>
      <!-- bezel chin + stand -->
      <rect x="1168" y="498" width="98" height="10" rx="5" fill="#1B1B22"/>
      <rect x="1206" y="508" width="22" height="42" rx="4" fill="#16161C"/>
      <ellipse cx="1217" cy="556" rx="78" ry="9" fill="#000000" fill-opacity="0.55"/>
    </g>

    <!-- brightness card -->
    <g transform="rotate(2.4 1290 142)" filter="url(#cardShadow)">
      <rect x="1104" y="86" width="390" height="112" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.7"/>
      <rect x="1122" y="104" width="32" height="32" rx="16" fill="#6E8A60"/>
      <g stroke="#EAF2E7" stroke-width="1.6" stroke-linecap="round">
        <circle cx="1138" cy="120" r="5.2" fill="none"/>
        <line x1="1138" y1="110.5" x2="1138" y2="113.5"/>
        <line x1="1138" y1="126.5" x2="1138" y2="129.5"/>
        <line x1="1128.5" y1="120" x2="1131.5" y2="120"/>
        <line x1="1144.5" y1="120" x2="1147.5" y2="120"/>
        <line x1="1131.3" y1="113.3" x2="1133.4" y2="115.4"/>
        <line x1="1142.6" y1="124.6" x2="1144.7" y2="126.7"/>
        <line x1="1144.7" y1="113.3" x2="1142.6" y2="115.4"/>
        <line x1="1133.4" y1="124.6" x2="1131.3" y2="126.7"/>
      </g>
      <text x="1168" y="123" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1D241D">Brightness</text>
      <text x="1470" y="123" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#687668">52%</text>
      <rect x="1122" y="160" width="320" height="6" rx="3" fill="#DDE6DC"/>
      <rect x="1122" y="160" width="168" height="6" rx="3" fill="#6E8A60"/>
      <circle cx="1290" cy="163" r="12" fill="#FFFFFF" stroke="#E4EBE3" stroke-width="1"/>
      <circle cx="1290" cy="163" r="10" fill="#FFFFFF"/>
    </g>

    <!-- layout card -->
    <g transform="rotate(-3 1390 554)" filter="url(#cardShadow)">
      <rect x="1230" y="486" width="330" height="138" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.7"/>
      <text x="1252" y="513" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#718071" letter-spacing="2.1">LAYOUT</text>
      <rect x="1252" y="528" width="94" height="66" rx="7" fill="#DDEBDD" stroke="#6E8A60" stroke-width="1.4"/>
      <rect x="1354" y="528" width="176" height="66" rx="7" fill="#E9EAE7" stroke="#9BA49B" stroke-width="1"/>
      <circle cx="1338" cy="536" r="6" fill="#416730"/>
      <path d="M1335.2 536.2l1.9 1.9 3.4-3.8" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1262" y="567" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#4B5A4B">Built-in</text>
      <text x="1398" y="567" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#5C655C">27-inch external</text>
    </g>

    <!-- small accent particles -->
    <circle cx="1514" cy="206" r="2.4" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="1552" cy="258" r="1.8" fill="#FFFFFF" fill-opacity="0.3"/>
    <circle cx="980" cy="238" r="1.8" fill="#FFFFFF" fill-opacity="0.3"/>
    <circle cx="936" cy="520" r="2.6" fill="#6E8A60" fill-opacity="0.85"/>
  </g>
</svg>
